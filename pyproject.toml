[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isascale-emulator"
version = "0.1.0"
description = "CAN emulator for the Isabellenhuette IVT-S-U0 current sensor (hexagonal architecture)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-can>=4.3",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13.4"]
dev = ["pytest>=8", "pytest-mock>=3.12", "pytest-cov>=5"]

[project.scripts]
isascale-emulator = "isascale.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: uses the python-can virtual bus",
    "gui: needs PySide6 + offscreen Qt platform",
]
